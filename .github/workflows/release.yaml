# Publish a release from the Flatpak bundle build.yaml produced.
#
# This does not build anything itself. It calls build.yaml -- the same workflow every
# pull request into main has to pass -- and publishes the artifact that came out of it,
# so what ships is exactly what was tested rather than a second, separate build that
# happens to have been run against the same commit.
name: release

on:
  push:
    branches: [main]
    # A release carries a gigabyte of Wine, so don't cut one for a docs-only change.
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s nzxt-cam-linux.flatpak ] || { echo "no bundle came back from build" >&2; exit 1; }
          ls -lh nzxt-cam-linux.flatpak

          tag="v$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          wine_version="$(cat WINE_VERSION)"

          {
            echo "Install with:"
            echo
            echo '```bash'
            echo "flatpak install --user nzxt-cam-linux.flatpak"
            echo '```'
            echo
            echo "Then start it from your application menu, or with:"
            echo
            echo '```bash'
            echo "flatpak run io.github.adds39939.NzxtCamLinux"
            echo '```'
            echo
            echo "The first run downloads NZXT CAM from NZXT and installs it into the"
            echo "bundled Wine prefix. Nothing else is needed on the host -- no wine,"
            echo "no winetricks, no cabextract -- except one udev rule, which is the"
            echo "only step that needs root:"
            echo
            echo '```bash'
            echo "flatpak run --command=nzxt-cam-setup io.github.adds39939.NzxtCamLinux --udev-help"
            echo '```'
            echo
            echo "Remove it again with:"
            echo
            echo '```bash'
            echo "flatpak uninstall --delete-data io.github.adds39939.NzxtCamLinux"
            echo '```'
            echo
            echo "Bundles **wine-${wine_version}**, patched, built from ${{ github.sha }}."
          } > release-notes.md

          gh release create "$tag" nzxt-cam-linux.flatpak \
            --title "$tag" \
            --notes-file release-notes.md \
            --latest
