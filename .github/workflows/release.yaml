# Publish a release from the binaries build.yaml produced.
#
# This does not build anything itself. It calls build.yaml -- the same workflow every
# pull request into main has to pass -- and publishes the artifact that came out of it,
# so what ships is exactly what was tested rather than a second, separate build that
# happens to have been run against the same commit.
name: release

on:
  push:
    branches: [main]
    # A release carries binaries, so don't cut one for a docs-only change.
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s nzxt-cam-linux.tar.gz ] || { echo "no tarball came back from build" >&2; exit 1; }
          ls -lh nzxt-cam-linux.tar.gz

          tag="v$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          wine_version="$(cat WINE_VERSION)"

          {
            echo "Install or update with:"
            echo
            echo '```bash'
            echo "curl -L https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash"
            echo '```'
            echo
            echo "That downloads NZXT CAM, builds a patched Wine prefix from the tarball"
            echo "below and installs a \`nzxt-cam\` launcher."
            echo
            echo "Remove it again with:"
            echo
            echo '```bash'
            echo "curl -L https://raw.githubusercontent.com/${{ github.repository }}/main/uninstall.sh | bash"
            echo '```'
            echo
            echo "That deletes the Wine prefix, the launcher and the menu entries."
            echo
            echo "Built against **wine-${wine_version}** from ${{ github.sha }}."
          } > release-notes.md

          gh release create "$tag" nzxt-cam-linux.tar.gz \
            --title "$tag" \
            --notes-file release-notes.md \
            --latest
