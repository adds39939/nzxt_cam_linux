# Build the Flatpak, and the single-file bundle around it.
#
# Everything this project ships is built here from source: Wine with the twenty
# patches applied, the three small Windows tools, and the scripts around them. That is
# also what makes the LGPL side of it honest -- the manifest plus patches/ IS the
# corresponding source for the Wine binaries in the bundle.
#
# This runs on every pull request into main, so a patch that no longer applies, or a
# manifest that has drifted from the patch series, is caught while it is still a pull
# request rather than when the next release is cut from it. release.yaml calls this
# same workflow and publishes the artifact it produced, so what ships is exactly what
# was tested.
name: build

on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      artifact:
        description: Name of the artifact holding the Flatpak bundle
        value: ${{ jobs.build.outputs.artifact }}
  workflow_dispatch:

permissions:
  contents: read

env:
  APPID: io.github.adds39939.NzxtCamLinux
  MANIFEST: flatpak/io.github.adds39939.NzxtCamLinux.yml
  RUNTIME_VERSION: '25.08'

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.pack.outputs.name }}

    steps:
      - uses: actions/checkout@v7

      # Nearly all of this repo is shell, and a syntax error in it survives review far
      # too easily. Cheap to rule out before spending an hour building Wine.
      - name: Check the shell scripts parse
        run: |
          rc=0
          for f in scripts/*; do
            head -1 "$f" | grep -q 'bin/env bash' || continue
            if bash -n "$f" 2>/dev/null; then
              printf '  ok      %s\n' "$f"
            else
              printf '  SYNTAX  %s\n' "$f"; bash -n "$f" || true; rc=1
            fi
          done
          python3 -m py_compile scripts/nzxt-cam-nvml && printf '  ok      %s\n' scripts/nzxt-cam-nvml
          [ "$rc" -eq 0 ] || { echo "shell syntax errors above" >&2; exit 1; }

      # The manifest names each patch by hand. Adding one to patches/ and forgetting to
      # list it would build a Wine missing that fix, and nothing downstream would say
      # so -- the cooler would simply not be detected. Check both directions.
      - name: Check the manifest matches the patch series
        run: |
          listed="$(grep -oP '(?<=path: \.\./)patches/\S+' "$MANIFEST" | sort)"
          onDisk="$(ls patches/*.patch | sort)"
          if [ "$listed" != "$onDisk" ]; then
            echo "the manifest and patches/ disagree:" >&2
            diff <(echo "$listed") <(echo "$onDisk") || true
            exit 1
          fi
          printf '  ok      %d patches, all listed\n' "$(echo "$onDisk" | wc -l)"

          # WINE_VERSION is what the docs quote; the manifest is what actually gets
          # built. They must not drift.
          want="$(cat WINE_VERSION)"
          grep -q "wine-${want}.tar.xz" "$MANIFEST" || {
            echo "WINE_VERSION says $want but the manifest builds something else" >&2
            grep -n 'dl.winehq.org' "$MANIFEST" >&2
            exit 1; }
          printf '  ok      manifest builds wine-%s\n' "$want"

          # --allow=multiarch looks like it belongs to a 32-bit application and this
          # one is x86-64 throughout, so it is an easy permission to drop as dead
          # weight. Without it the sandbox's seccomp filter refuses to start any
          # 32-bit process: Wine's WoW64 half never runs, C:\windows\syswow64 stays
          # empty, and the first run dies several minutes in when winetricks cannot
          # register a font. Nothing about that failure points here.
          grep -q -- '--allow=multiarch' "$MANIFEST" || {
            echo "the manifest has no --allow=multiarch; WoW64 will not work" >&2
            exit 1; }
          printf '  ok      --allow=multiarch is set (WoW64 needs it)\n'

      - name: Check the desktop entry and AppStream data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate flatpak/$APPID.desktop
          appstreamcli validate --no-net --explain flatpak/$APPID.metainfo.xml

      - name: Install flatpak and the runtimes
        run: |
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder ccache
          flatpak remote-add --if-not-exists --user \
            flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub \
            org.freedesktop.Platform//$RUNTIME_VERSION \
            org.freedesktop.Sdk//$RUNTIME_VERSION \
            org.freedesktop.Sdk.Extension.mingw-w64//$RUNTIME_VERSION

      # Wine is most of the hour this takes. ccache turns a re-run of an unchanged
      # build into minutes, and the downloads cache keeps the 45MB Wine tarball and the
      # winetricks checkout out of every run.
      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder/ccache
            .flatpak-builder/downloads
          key: flatpak-${{ runner.os }}-${{ hashFiles('flatpak/*.yml', 'patches/*.patch') }}
          restore-keys: flatpak-${{ runner.os }}-

      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --ccache \
            --repo=repo --force-clean build-dir "$MANIFEST"

      # The manifest is long and most of its mistakes are silent ones: a tool that did
      # not get installed, a patched driver that did not end up where Wine maps it
      # from. Look inside the finished build rather than trust that it exited zero.
      - name: Check the build contains what it must
        run: |
          rc=0
          check() {                       # check <path> <what it is>
            if [ -s "build-dir/files/$1" ]; then printf '  ok      %s\n' "$1"
            else printf '  MISSING %s  (%s)\n' "$1" "$2"; rc=1; fi
          }
          # The two patched kernel drivers, in the one place Wine maps them from.
          check lib/wine/x86_64-windows/hidclass.sys "HID interface properties"
          check lib/wine/x86_64-windows/wineusb.sys  "USB device interface"
          check lib/wine/x86_64-unix/wineusb.so      "the libusb half of wineusb"
          check lib/wine/x86_64-windows/explorer.exe "named tray icon windows"
          # The patched user-mode DLLs, as Wine's own builtins.
          for d in propsys windows.devices.enumeration windows.devices.usb \
                   cfgmgr32 winusb wintypes setupapi; do
            check "lib/wine/x86_64-windows/$d.dll" "patched builtin"
          done
          # The Windows-side tools and the launcher.
          check share/nzxt-cam/usbtree-fixup.exe    "device tree fixup"
          check share/nzxt-cam/gpu-pci-fixup.exe    "GPU PCI location"
          check share/nzxt-cam/cpuidsdk64_shim.dll  "CPU and GPU telemetry"
          check share/nzxt-cam/60-nzxt-cam.rules    "the udev rule to hand the user"
          check bin/nzxt-cam                        "launcher"
          check bin/nzxt-cam-setup                  "first-run install"
          check bin/nzxt-cam-autostart              "start on login"
          check bin/nzxt-cam-gpu-poll               "GPU readings"
          check bin/nzxt-cam-nvml                   "GPU readings on NVIDIA"
          check bin/wine                            "Wine itself"
          check bin/winetricks                      "corefonts on first run"
          check bin/cabextract                      "what winetricks unpacks with"
          # The 32-bit PE half. CAM and NZXT's installer are both x86-64, so it is easy
          # to think this is dead weight -- but winetricks registers every font it
          # installs by running syswow64\regedit.exe, and without it corefonts aborts
          # on the first font and CAM starts to a blank window. Losing this silently is
          # a bug that only shows up several minutes into a user's first run.
          check lib/wine/i386-windows/regedit.exe   "syswow64, which winetricks needs"
          check lib/wine/i386-windows/ntdll.dll     "the 32-bit PE half"
          [ "$rc" -eq 0 ] || { echo "the build is incomplete" >&2; exit 1; }

          # A patched DLL that silently fell back to the stock one would pass every
          # check above. Look for something only the patches introduce. The names are
          # wide string literals in the binary, so -el (16-bit little-endian) rather
          # than a plain grep, which finds nothing.
          if ! strings -el build-dir/files/lib/wine/x86_64-windows/propsys.dll \
               | grep -q 'System.DeviceInterface.Hid.UsagePage'; then
            echo "propsys.dll does not contain the patched HID property names" >&2
            exit 1
          fi
          echo "  ok      propsys.dll carries the patched HID properties"

      - name: Build the bundle
        id: pack
        run: |
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo nzxt-cam-linux.flatpak "$APPID"
          ls -lh nzxt-cam-linux.flatpak
          echo "name=nzxt-cam-linux" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: nzxt-cam-linux
          path: nzxt-cam-linux.flatpak
          if-no-files-found: error
          retention-days: 7
